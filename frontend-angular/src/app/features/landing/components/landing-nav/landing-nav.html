<header
  class="nav"
  [class.nav--scrolled]="scrolled()"
>
  <div class="nav__inner">

    <a
      routerLink="/"
      class="brand"
      aria-label="Trackr home"
    >
      <!-- Temporary mark.
           We'll replace this when we create the real Trackr logo. -->
      <span class="brand__mark">
        T
      </span>

      <span class="brand__name">
        Trackr
      </span>
    </a>

    <nav
      class="nav__links"
      aria-label="Primary navigation"
    >
      <button
        type="button"
        (click)="scrollTo('product')"
      >
        Product
      </button>

      <button
        type="button"
        (click)="scrollTo('features')"
      >
        Features
      </button>

      <button
        type="button"
        (click)="scrollTo('how-it-works')"
      >
        How it works
      </button>
    </nav>

    <div class="nav__actions">

    <button
  class="theme-button"
  type="button"
  (click)="toggleTheme()"
  [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
>
  @if (isDark()) {
    <!-- Sun: shown while dark mode is active -->
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2
           M12 20v2
           M4.9 4.9l1.4 1.4
           M17.7 17.7l1.4 1.4
           M2 12h2
           M20 12h2
           M4.9 19.1l1.4-1.4
           M17.7 6.3l1.4-1.4"
      />
    </svg>
  } @else {
    <!-- Moon: shown while light mode is active -->
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path
        d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
      />
    </svg>
  }
    </button>
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>

      <a
        routerLink="/login"
        class="nav__login"
      >
        Sign in
      </a>

      <a
        routerLink="/register"
        class="button button--primary"
      >
        Get started
      </a>

      <button
        class="burger"
        type="button"
        aria-label="Open navigation"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        } @else {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 6h18M3 12h18M3 18h18" />
          </svg>
        }
      </button>

    </div>
  </div>

  @if (menuOpen()) {
    <nav
      class="mobile-nav"
      aria-label="Mobile navigation"
    >
      <button
        type="button"
        (click)="scrollTo('product')"
      >
        Product
      </button>

      <button
        type="button"
        (click)="scrollTo('features')"
      >
        Features
      </button>

      <button
        type="button"
        (click)="scrollTo('how-it-works')"
      >
        How it works
      </button>

      <a
        routerLink="/login"
        (click)="closeMenu()"
      >
        Sign in
      </a>

      <a
        routerLink="/register"
        class="mobile-cta"
        (click)="closeMenu()"
      >
        Get started
      </a>
    </nav>
  }
</header>
