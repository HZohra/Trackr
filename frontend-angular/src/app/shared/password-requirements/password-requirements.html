<ul class="mt-2 space-y-1">
  @for (item of items(); track item.label) {
    <li class="flex items-center gap-2 text-xs" [class.text-leaf]="item.met" [class.text-faint]="!item.met">
      @if (item.met) {
        <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      } @else {
        <span class="grid h-3.5 w-3.5 shrink-0 place-items-center"><span class="h-1 w-1 rounded-full bg-current"></span></span>
      }
      {{ item.label }}
    </li>
  }
</ul>
