<a [routerLink]="['/courses', course().id]"
   class="block rounded-2xl border border-line bg-surface p-5 shadow-card"
   [class.opacity-75]="course().archived">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2">
      <span class="rounded-md px-2 py-0.5 text-xs font-bold text-white" [style.backgroundColor]="hex()">{{ course().code }}</span>
      @if (course().archived) { <span class="rounded bg-surface2 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-muted">Archived</span> }
    </div>
    <span class="tabular-nums text-sm font-bold" [style.color]="gradeColor()">
      {{ course().currentGrade === null ? '—' : course().currentGrade + '%' }}
    </span>
  </div>

  <h4 class="mt-3 font-display text-base font-bold leading-snug text-ink">{{ course().name }}</h4>
  <p class="mt-0.5 text-sm text-muted">{{ course().professor || 'No instructor' }}</p>

  <div class="mt-5">
    <div class="h-2 w-full overflow-hidden rounded-full bg-surface2">
      <div class="h-full rounded-full transition-[width] duration-700"
           [style.width.%]="course().percentComplete" [style.backgroundColor]="hex()"></div>
    </div>
    <span class="mt-2 block text-xs tabular-nums text-faint">{{ course().percentComplete }}% complete</span>
  </div>
</a>
