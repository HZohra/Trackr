<a class="relative block overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 pl-6 shadow-sm transition hover:shadow-md">
  <!-- colored left accent bar -->
  <span class="absolute inset-y-0 left-0 w-1.5" [style.backgroundColor]="hex()"></span>

  <div class="flex items-start justify-between">
    <span class="rounded-md px-2 py-0.5 text-xs font-semibold text-white" [style.backgroundColor]="hex()">{{ course().code }}</span>
    <span class="text-sm font-bold text-slate-800">{{ course().currentGrade === null ? '—' : course().currentGrade + '%' }}</span>
  </div>

  <h4 class="mt-3 text-base font-bold text-slate-800">{{ course().name }}</h4>
  <p class="mt-0.5 text-sm text-slate-500">{{ course().professor }}</p>

  <div class="mt-5">
    <div class="h-2 w-full overflow-hidden rounded-full bg-slate-100">
      <div class="h-full rounded-full transition-[width] duration-700"
           [style.width.%]="course().percentComplete" [style.backgroundColor]="hex()"></div>
    </div>
    <span class="mt-2 block text-xs text-slate-400">{{ course().percentComplete }}% complete</span>
  </div>
</a>
