<a [routerLink]="['/courses', course().id]"
   class="block overflow-hidden rounded-2xl border border-line bg-surface p-5 shadow-card transition hover:border-line"
   [class.opacity-75]="course().archived">
  <!-- colour bar on top -->
  <div class="mb-3 h-1 w-8 rounded-full" [style.backgroundColor]="hex()"></div>

  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <p class="font-display text-base font-bold leading-tight text-ink">{{ course().code }}</p>
      <p class="mt-0.5 truncate text-sm text-muted">{{ course().name }}</p>
    </div>
    @if (course().archived) {
      <span class="shrink-0 rounded bg-surface2 px-1.5 py-0.5 text-[10px] font-semibold uppercase text-muted">Archived</span>
    }
  </div>

  <div class="mt-4 flex items-baseline justify-between">
    <span class="font-display text-2xl font-extrabold tabular-nums" [style.color]="gradeColor()">
      {{ course().currentGrade === null ? '—' : course().currentGrade + '%' }}
    </span>
    @if (nextLabel()) {
      <span class="truncate text-xs font-medium text-faint">Next · {{ nextLabel() }}</span>
    } @else {
      <span class="text-xs text-faint">{{ course().percentComplete }}% complete</span>
    }
  </div>
</a>
