<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trackr</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts: Bricolage Grotesque (display) + Plus Jakarta Sans (UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  
  <link rel="preconnect" 
        href="https://fonts.gstatic.com" 
        crossorigin
  >
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" 
        rel="stylesheet"
  >

  <!-- Apply the saved theme + accent before first paint, so there's no flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('trackr-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var a = localStorage.getItem('trackr-accent');
        if (a) document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
