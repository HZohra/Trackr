<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Set a new password · Trackr</title>

        <script type="module" src="../js/pages/reset-password.js"></script>
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem("trackr-theme") || "light";
            } catch (e) {
                document.documentElement.dataset.theme = "light";
            }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../css/tokens.css" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/pages/auth.css" />
    </head>

    <body>
        <main class="auth">
            <a class="auth-brand" href="../index.html" aria-label="Trackr home">
                <img src="../assets/logo.png" alt="Trackr logo" />
                <span class="brand-name">Trackr</span>
            </a>

            <section class="auth-card" aria-labelledby="reset-title">
                <img
                    src="../assets/reset-password.png"
                    alt=""
                    aria-hidden="true"
                    class="auth-illustration"
                />

                <h1 class="auth-title" id="reset-title">Reset password</h1>
                <p class="auth-subtitle">
                    Create a new password for your account.
                </p>

                <form class="auth-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="new-password"
                            >New password</label
                        >
                        <input
                            class="input"
                            type="password"
                            id="new-password"
                            name="newPassword"
                            autocomplete="new-password"
                            required
                        />
                        <p
                            class="field-error"
                            data-error-for="new-password"
                            role="alert"
                        ></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="confirm-password"
                            >Confirm new password</label
                        >
                        <input
                            class="input"
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            autocomplete="new-password"
                            required
                        />
                        <p
                            class="field-error"
                            data-error-for="confirm-password"
                            role="alert"
                        ></p>
                    </div>

                    <!-- shared password checklist: JS adds .met as each rule passes -->
                    <div class="password-rules">
                        <p class="password-rules-title">
                            Password requirements
                        </p>
                        <ul class="rule-list" aria-live="polite">
                            <li class="rule" data-rule="length">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >At least 8 characters
                            </li>
                            <li class="rule" data-rule="uppercase">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One uppercase letter
                            </li>
                            <li class="rule" data-rule="number">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One number
                            </li>
                            <li class="rule" data-rule="special">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One special character
                            </li>
                        </ul>
                    </div>

                    <div class="show-password">
                        <label for="showPassword">
                            <input type="checkbox" id="showPassword" />
                            Show Password
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Reset password
                    </button>
                    <a class="btn btn-secondary btn-block" href="login.html"
                        >Cancel</a
                    >
                </form>
            </section>
        </main>
    </body>
</html>
