<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar · Trackr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
    <link rel="stylesheet" href="../css/pages/calendar.css" />
  </head>

  <body class="app" data-page="calendar">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <div class="page">
          <div class="cal-header">
            <div>
              <h1>Calendar</h1>
              <p class="subtext">Track deadlines, exams, and reminders</p>
            </div>
            <div class="view-toggle">
              <span
                id="month-btn"
                class="toggle-btn active"
                onclick="setView('month')"
                >Month</span
              >
              <span id="week-btn" class="toggle-btn" onclick="setView('week')"
                >Week</span
              >
            </div>
          </div>

          <div id="warning-box" class="warning hide"></div>

          <div class="card cal-card">
            <div class="cal-top">
              <div>
                <h2 id="month-label">Month</h2>
                <small id="semester-label">Spring 2026 - Week 11</small>
              </div>
              <div class="cal-nav">
                <span onclick="prevMonth()">&lt;</span>
                <span onclick="nextMonth()">&gt;</span>
              </div>
            </div>

            <div id="month-view">
              <div class="weekday-row">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
                <span>Thu</span><span>Fri</span><span>Sat</span>
              </div>
              <div id="cal-grid" class="cal-grid"></div>
            </div>

            <div id="week-view" class="hide">
              <div id="week-list"></div>
            </div>

            <div class="legend">
              <span><i class="dot assignment"></i>Assignment</span>
              <span><i class="dot exam"></i>Exam</span>
              <span><i class="dot lab"></i>Lab</span>
              <span><i class="dot reminder"></i>Reminder</span>
            </div>
          </div>

          <div class="cal-bottom">
            <div class="card">
              <h2>Upcoming</h2>
              <div id="upcoming-list"></div>
            </div>

            <div class="card">
              <h2>Filter Events</h2>
              <label class="filter-row">
                <input
                  type="checkbox"
                  id="f-assignment"
                  checked
                  onchange="render()"
                />
                <span><i class="dot assignment"></i>Assignments</span>
              </label>
              <label class="filter-row">
                <input
                  type="checkbox"
                  id="f-exam"
                  checked
                  onchange="render()"
                />
                <span><i class="dot exam"></i>Exams</span>
              </label>
              <label class="filter-row">
                <input type="checkbox" id="f-lab" checked onchange="render()" />
                <span><i class="dot lab"></i>Labs</span>
              </label>
              <label class="filter-row">
                <input
                  type="checkbox"
                  id="f-reminder"
                  checked
                  onchange="render()"
                />
                <span><i class="dot reminder"></i>Reminders</span>
              </label>
            </div>

            <div class="card">
              <h2>This Week</h2>
              <div id="week-glance"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/include.js"></script>
    <script type="module" src="../js/calendar.js"></script>
  </body>
</html>
