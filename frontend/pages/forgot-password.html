<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password · Trackr</title>

  <script type="module" src="../js/pages/forgot-password.js"></script>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("trackr-theme") || "light"; }
    catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
</head>

<body>
  <main class="auth">
    <a class="auth-brand" href="../index.html" aria-label="Trackr home">
      <img src="../assets/logo.png" alt="Trackr logo" />
      <span class="brand-name">Trackr</span>
    </a>

    <section class="auth-card" aria-labelledby="auth-title">
      <img src="../assets/forgot-password.png" alt="" aria-hidden="true" class="auth-illustration" />

      <h1 class="auth-title" id="auth-title">Reset your password</h1>
      <p class="auth-subtitle">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <form class="auth-form" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email"
                 autocomplete="email" placeholder="user@university.ca" required />
          <p class="field-error" data-error-for="email" role="alert"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>

      <p class="auth-footer">
        <a class="link" href="login.html">Cancel</a>
      </p>
    </section>
  </main>
</body>
</html>
