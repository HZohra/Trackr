<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignments · Trackr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
    <style>
      /* Add assignment modal — the only modal in the app so far, so it lives
         here with the page rather than in the shared stylesheets. */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: rgba(0, 0, 0, 0.45);
        overflow-y: auto;
      }
      .modal-backdrop[hidden] { display: none; }
      .modal {
        width: 100%;
        max-width: 620px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 1.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-xl);
        box-shadow: var(--shadow-raised);
      }
      .modal h2 { margin: 0 0 1rem; }

      /* Same label-over-input convention as extraction-review.html. */
      .review-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.75rem; }
      .review-field > label { font-weight: 600; font-size: 0.8rem; }
      .review-field input,
      .review-field select { width: 100%; }
      .review-field input.is-invalid,
      .review-field select.is-invalid { border-color: #e1483b; }

      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.75rem; }
      @media (max-width: 520px) { .field-row { grid-template-columns: 1fr; } }

      .modal fieldset {
        margin: 0.25rem 0 0.75rem;
        padding: 0.75rem 0 0;
        border: none;
        border-top: 1px solid var(--border);
      }
      .modal legend {
        padding: 0 0.4rem 0 0;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.7;
      }

      #formError {
        color: #e1483b;
        font-weight: 600;
        font-size: 0.85rem;
        min-height: 1em;
      }
      .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.75rem; }
    </style>
  </head>
  <body class="app" data-page="assignments">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <div class="page">
          <p class="page-eyebrow">Assignments</p>
          <h1>All Assignments</h1>
          <p class="subtext">8 total · 1 overdue</p>

          <div class="filters">
            <input
              type="text"
              id="filterSearch"
              placeholder="Search assignments…"
              style="flex: 1; min-width: 180px"
            />
            <!-- Both selects are populated from real data in assignment-view.js. -->
            <select id="filterCourse">
              <option value="">All Courses</option>
            </select>
            <select id="filterStatus">
              <option value="">All Status</option>
            </select>
            <button class="btn" id="addAssignmentBtn">+ Add assignment</button>
          </div>

          <div class="tabs" id="sortTabs">
            <button class="is-active" data-sort="due">Due date</button>
            <button data-sort="priority">Priority</button>
            <button data-sort="weight">Weight</button>
          </div>

          <div id="assignmentList"></div>

          <!-- Add assignment modal. Course + category options are filled in
               from real data by assignment-view.js. -->
          <div class="modal-backdrop" id="addModal" hidden>
            <div
              class="modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="addModalTitle"
            >
              <h2 id="addModalTitle">Add an assignment</h2>
              <form id="addAssignmentForm" novalidate>
                <div class="review-field">
                  <label for="a-course">Course</label>
                  <select id="a-course" required></select>
                </div>
                <div class="review-field">
                  <label for="a-name">Assignment name</label>
                  <input id="a-name" type="text" maxlength="150" required />
                </div>
                <div class="field-row">
                  <div class="review-field">
                    <label for="a-category">Category</label>
                    <select id="a-category" required></select>
                  </div>
                  <div class="review-field">
                    <label for="a-weight">Weight (% of final grade)</label>
                    <input
                      id="a-weight"
                      type="number"
                      min="0"
                      max="100"
                      step="0.01"
                      placeholder="0"
                    />
                  </div>
                </div>
                <div class="review-field">
                  <label for="a-due">Due date</label>
                  <input id="a-due" type="datetime-local" required />
                </div>

                <fieldset>
                  <legend>Reminder</legend>
                  <div class="field-row">
                    <div class="review-field">
                      <label for="a-reminder">Remind me on (optional)</label>
                      <input id="a-reminder" type="datetime-local" />
                    </div>
                    <div class="review-field">
                      <label for="a-method">Send via</label>
                      <select id="a-method">
                        <option value="email">Email</option>
                        <option value="whatsapp">WhatsApp</option>
                      </select>
                    </div>
                  </div>
                  <div class="review-field">
                    <label for="a-priority">Priority</label>
                    <select id="a-priority">
                      <option value="low">Low</option>
                      <option value="medium" selected>Medium</option>
                      <option value="high">High</option>
                    </select>
                  </div>
                </fieldset>

                <p id="formError" role="alert"></p>

                <div class="modal-actions">
                  <button type="button" class="cancel-btn" id="cancelAdd">
                    Cancel
                  </button>
                  <button type="submit" class="btn" id="saveAssignment">
                    Add assignment
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="../js/include.js"></script>
    <script type="module" src="../js/assignment-view.js"></script>
  </body>
</html>
