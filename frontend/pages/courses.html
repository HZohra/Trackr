<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
  </head>

  <body class="app" data-page="courses">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <!-- Two modes, both driven by js/course.js:
             no ?id  -> #courseGrid, every course as a card
             ?id=N   -> #courseDetail, that one course.
             Everything below is an empty shell; the page fills it from the API. -->
        <div class="page">
          <p class="page-eyebrow" id="courseEyebrow">Courses</p>

          <!-- grid mode -->
          <section id="courseGrid" hidden>
            <h1>Your Courses</h1>
            <p class="subtext" id="courseGridSub"></p>
            <div class="dash-courses" id="courseCards"></div>
          </section>

          <!-- detail mode -->
          <section id="courseDetail" hidden>
            <div class="course-top">
              <div class="course-title-row">
                <div id="courseHeader"></div>

                <div class="course-grade-cell">
                  <p>Current Grade</p>
                  <div id="courseGrade" class="current-grade">—</div>
                </div>
              </div>

              <div class="course-progress-bg">
                <div id="courseBar" class="course-progress-fill"></div>
              </div>

              <div class="course-delete-area">
                <button id="deleteCourseBtn" type="button" class="danger-btn" hidden>
                  Delete Course
                </button>
              </div>
            </div>

            <div class="course-grid">
              <div class="card">
                <h2>Grade Breakdown</h2>
                <div id="courseBreakdown"></div>
              </div>

              <div class="card">
                <h2>Assignments</h2>
                <div id="courseAssignments"></div>
              </div>
            </div>
          </section>

          <!-- empty / error / loading messages -->
          <div id="courseMsg"></div>
        </div>
      </main>
    </div>
    <script type="module" src="../js/include.js"></script>
    <script type="module" src="../js/course.js"></script>
  </body>
</html>
