<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create account · Trackr</title>

        <script
            src="https://accounts.google.com/gsi/client"
            async
            defer
        ></script>
        <script type="module" src="../js/pages/signup.js"></script>
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem("trackr-theme") || "light";
            } catch (e) {
                document.documentElement.dataset.theme = "light";
            }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../css/tokens.css" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/components.css" />
        <link rel="stylesheet" href="../css/pages/auth.css" />
    </head>

    <body>
        <main class="auth">
            <a class="auth-brand" href="../index.html" aria-label="Trackr home">
                <img src="../assets/logo.png" alt="Trackr logo" />
                <span class="brand-name">Trackr</span>
            </a>

            <section class="auth-card" aria-labelledby="auth-title">
                <h1 class="auth-title" id="auth-title">Welcome to Trackr</h1>

                <div
                    id="google-config"
                    data-client-id="996024430540-k55vtp94um72er2mff7lorr50dd5kikg.apps.googleusercontent.com"
                ></div>
                <button
                    type="button"
                    class="btn btn-google"
                    data-action="google-signup"
                >
                    <svg
                        class="google-icon"
                        viewBox="0 0 18 18"
                        width="18"
                        height="18"
                        aria-hidden="true"
                    >
                        <path
                            fill="#4285F4"
                            d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"
                        />
                        <path
                            fill="#34A853"
                            d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"
                        />
                        <path
                            fill="#FBBC05"
                            d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"
                        />
                        <path
                            fill="#EA4335"
                            d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"
                        />
                    </svg>
                    Continue with Google
                </button>

                <div class="divider"><span>or</span></div>

                <form class="auth-form" novalidate>
                    <div class="field">
                        <label class="field-label" for="first-name"
                            >First name</label
                        >

                        <input
                            class="input"
                            type="text"
                            id="first-name"
                            name="firstName"
                            placeholder="First name"
                            required
                        />

                        <p
                            class="field-error"
                            data-error-for="first-name"
                            role="alert"
                        ></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="last-name"
                            >Last name</label
                        >

                        <input
                            class="input"
                            type="text"
                            id="last-name"
                            name="lastName"
                            placeholder="Last name"
                            required
                        />

                        <p
                            class="field-error"
                            data-error-for="last-name"
                            role="alert"
                        ></p>
                    </div>
                    <div class="field">
                        <label class="field-label" for="email">Email</label>
                        <input
                            class="input"
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            placeholder="user@university.ca"
                            required
                        />
                        <p
                            class="field-error"
                            data-error-for="email"
                            role="alert"
                        ></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="password"
                            >Password</label
                        >
                        <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            required
                        />
                        <p
                            class="field-error"
                            data-error-for="password"
                            role="alert"
                        ></p>
                    </div>

                    <div class="field">
                        <label class="field-label" for="confirm-password"
                            >Confirm password</label
                        >
                        <input
                            class="input"
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            autocomplete="new-password"
                            required
                        />
                        <p
                            class="field-error"
                            data-error-for="confirm-password"
                            role="alert"
                        ></p>
                    </div>

                    <!-- shared password checklist: JS adds .met as each rule passes -->
                    <div class="password-rules">
                        <p class="password-rules-title">
                            Password requirements
                        </p>
                        <ul class="rule-list" aria-live="polite">
                            <li class="rule" data-rule="length">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >At least 8 characters
                            </li>
                            <li class="rule" data-rule="uppercase">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One uppercase letter
                            </li>
                            <li class="rule" data-rule="number">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One number
                            </li>
                            <li class="rule" data-rule="special">
                                <span
                                    class="rule-mark"
                                    aria-hidden="true"
                                ></span
                                >One special character
                            </li>
                        </ul>
                    </div>

                    <div class="show-password">
                        <label for="showPassword">
                            <input type="checkbox" id="showPassword" />
                            Show Password
                        </label>
                    </div>

                    <!-- US-01: user must choose Student or Admin -->
                    <fieldset class="role-select">
                        <legend class="field-label">I'm signing up as</legend>
                        <label class="role-option">
                            <input
                                type="radio"
                                name="role"
                                value="student"
                                checked
                            />
                            <span>Student</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="admin" />
                            <span>Admin</span>
                        </label>
                    </fieldset>

                    <button type="submit" class="btn btn-primary btn-block">
                        Create account
                    </button>
                </form>

                <p class="auth-footer">
                    Already have an account?
                    <a class="link" href="login.html">Sign in</a>
                </p>
            </section>
        </main>
    </body>
</html>
