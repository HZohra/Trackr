<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Trackr</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        var saved = localStorage.getItem("trackr-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        document.documentElement.setAttribute(
          "data-theme",
          saved || (prefersDark ? "dark" : "light"),
        );
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../css/app-shell.css" />
    <link rel="stylesheet" href="../css/app-pages.css" />
    <link rel="stylesheet" href="../css/pages/dashboard.css" />
  </head>

  <body class="app" data-page="dashboard">
    <div data-include="../partials/student-sidebar.html"></div>

    <div class="app-main">
      <div data-include="../partials/topbar.html"></div>

      <main class="app-content">
        <header class="dash-head">
          <p class="dash-eyebrow">Dashboard</p>
          <h1 class="dash-title">
            Welcome back, <span id="dashName"></span>.
          </h1>
          <p class="dash-status" id="dashStatus">Loading your semester…</p>
        </header>

        <section
          class="dash-stats"
          id="dashStats"
          aria-label="Overview"
        ></section>

        <div class="dash-grid">
          <section class="dash-card dash-upcoming">
            <div class="dash-card__head">
              <h2>Upcoming</h2>
              <a href="assignments-view.html">View all →</a>
            </div>
            <ul class="arow-list" id="dashUpcoming"></ul>
          </section>

          <div class="dash-side">
            <section class="dash-card" id="dashGpa"></section>
          </div>
        </div>

        <section class="dash-courses-wrap">
          <div class="dash-card__head">
            <h2>Your courses</h2>
            <a href="courses.html">View all →</a>
          </div>
          <div class="dash-courses" id="dashCourses"></div>
        </section>
      </main>
    </div>

    <script type="module" src="../js/include.js"></script>
    <script type="module" src="../js/pages/dashboard.js"></script>
  </body>
</html>
